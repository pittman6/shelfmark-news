[project]
name = "shelfmark-news"
version = "0.1.2"
description = "A Newznab/SABnzbd API wrapper around shelfmark for book searching and downloading"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "pittman6" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "shelfmark[browser]",
    "python-multipart>=0.0.32",
]

[tool.uv]
# PyAutoGUI/MouseInfo pull in legacy python3-xlib, while Shelfmark's browser extra
# requires python-xlib. Both install files into the same site-packages/Xlib/ path.
# uv.lock pins both distributions, but does not define ownership of overlapping
# files: even fresh venvs can load either implementation depending on install order.
# The legacy version lacks Xlib.X.FamilyServerInterpreted, which SeleniumBase needs
# to start browser-based challenge bypass. Keep only python-xlib, which also
# provides the Xlib API used by PyAutoGUI/MouseInfo.
# Remove this exclusion once upstream dependencies stop pulling in python3-xlib.
# https://docs.astral.sh/uv/concepts/preview/#detect-module-conflicts
exclude-dependencies = ["python3-xlib"]

[tool.uv.sources]
shelfmark = { workspace = true }

[tool.uv.workspace]
members = [".", "src/shelfmark/"]

[tool.pyrefly]
search-path = ["src/shelfmark"]
project-excludes = ["src/shelfmark/**"]

[tool.ruff]
extend-exclude = ["src/shelfmark"]

[project.scripts]
shelfmark-news = "shelfmark_news.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.28.1",
    "pyrefly>=1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shelfmark_news"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
