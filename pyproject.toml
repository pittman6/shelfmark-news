[project]
name = "shelfmark-news"
version = "0.1.2"
description = "A Newznab/SABnzbd API wrapper around shelfmark for book searching and downloading"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pittman6" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "shelfmark[browser]",
    "python-multipart>=0.0.32",
]

[tool.uv.sources]
shelfmark = { workspace = true }

[tool.uv.workspace]
members = [".", "src/shelfmark/"]

[tool.pyrefly]
search-path = ["src/shelfmark"]
project-excludes = ["src/shelfmark/**"]

[tool.ruff]
extend-exclude = ["src/shelfmark"]

[project.scripts]
shelfmark-news = "shelfmark_news.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.28.1",
    "pyrefly>=1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shelfmark_news"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
